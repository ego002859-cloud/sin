   같이 쓰는 판에서 남이 탭을 바꾸면 방해가 된다. */

function clone(o){return JSON.parse(JSON.stringify(o))}
const OLD_TAB={feed:'all',reels:'review',refs:'ref'};/* 탭 4개 → 파이프라인 단일 네비 전환 */
function load(){try{const r=localStorage.getItem(KEY);if(!r)return clone(DEFAULTS);
  const d={...clone(DEFAULTS),...JSON.parse(r)};d.tab=OLD_TAB[d.tab]||d.tab;delete d.filter;return d}catch(e){return clone(DEFAULTS)}}
function loadCfg(){try{return JSON.parse(localStorage.getItem(CFG)||'{}')}catch(e){return{}}}
function saveCfg(){localStorage.setItem(CFG,JSON.stringify(cfg))}

/* 로컬은 항상 먼저 쓴다 — 인터넷이 끊겨도 작업은 계속돼야 한다 */
function save(){
  edits++;
  try{localStorage.setItem(KEY,JSON.stringify(D))}
  catch(e){if(!warned++)alert('브라우저 저장에 실패했습니다. 백업 버튼으로 내보내세요.')}
  if(cfg.url)queuePush();
}
function queuePush(){clearTimeout(pushT);setLink('pending');pushT=setTimeout(push,900)}

async function call(body){
  const u=cfg.url+(body?'':'?key='+encodeURIComponent(cfg.key));
  const opt=body?{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({...body,key:cfg.key})}:{};   /* text/plain = preflight 없음 */
  const r=await fetch(u,opt);
  return r.json();
}

async function pull(loud){
  if(!cfg.url)return;
  setLink('pending');
  const seen=edits;
  try{
    const d=await call(null);
    if(!d.ok)throw new Error(d.error);
    rev=d.rev;
    /* 불러오는 동안 내가 편집했다면 덮어쓰지 않는다 — 페이지를 열자마자 고칠 때 작업이 사라진다.
       버튼으로 직접 부른 불러오기(loud)는 의도한 것이므로 그대로 적용한다. */
    if(!loud&&edits!==seen){setLink('ok');return queuePush()}
    SHARED.forEach(k=>{if(d[k]!==undefined)D[k]=d[k]});
    /* 시트는 id를 문자열로 돌려준다. 카드 클릭이 숫자로 찾으므로 맞춰 놓는다. */
    const num=x=>x===''||x==null?null:(isNaN(+x)?x:+x);
    (D.refs||[]).forEach(r=>r.id=num(r.id));
    (D.posts||[]).forEach(p=>{p.id=num(p.id);p.refId=num(p.refId)});
    localStorage.setItem(KEY,JSON.stringify(D));
    setLink('ok');render();
    if(loud)alert(`불러왔습니다 — 레퍼런스 ${D.refs.length}건, 기획 ${D.posts.length}건`);
  }catch(e){setLink('off',e.message);if(loud)alert('불러오기 실패 — '+e.message)}
}

/* 시트 왕복이 5~8초다. 그 사이 또 저장하면 낡은 rev로 나가 자기 자신과 충돌한다.
   보내는 중이면 표시만 해두고, 끝난 뒤 한 번 더 보낸다. */
async function push(){
  if(!cfg.url)return;
  if(pushing){dirty=true;return}
  pushing=true;
  try{
    const body={rev};SHARED.forEach(k=>body[k]=D[k]);
    const d=await call(body);
    if(d.conflict){
      /* 남이 먼저 저장했다. 조용히 덮어쓰면 그 사람 작업이 사라진다. */
      setLink('conflict');
      if(confirm('다른 사람이 먼저 저장했습니다.\n\n[확인] 그쪽 내용을 불러옵니다 (내 최근 변경은 사라짐)\n[취소] 그대로 두고 백업으로 내보냅니다'))
        return pull(1);
      return exportJSON();
    }
    if(!d.ok)throw new Error(d.error);
    rev=d.rev;setLink('ok');renderCrumb();
  }catch(e){setLink('off',e.message)}
  finally{pushing=false;if(dirty){dirty=false;queuePush()}}
}

/* ─── 발행 · 피드백 (성과 목록) ─── */
function perfHTML(stage){
  const P=D.posts.filter(p=>p.stage===stage).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const g=D.goals[D.goalTab];
  const goalBox=`<div class="flex items-center justify-between mb-2.5 mt-6">
      <span class="text-[11px] font-bold text-zinc-500">목표 진행률</span>
      <div class="flex gap-1.5">${D.goals.map((x,i)=>`<button onclick="D.goalTab=${i};save();render()" class="text-[11px] font-semibold px-2.5 py-1 rounded-lg ${i===D.goalTab?'bg-white/[.14] text-zinc-100':'bg-white/[.05] text-zinc-500'}">${x.period}</button>`).join('')}
      <button onclick="openGoals()" class="text-[11px] font-semibold px-2.5 py-1 rounded-lg bg-white/[.05] text-zinc-400">수정</button></div></div>
    <div class="grid sm:grid-cols-2 gap-2.5">${g.items.map(it=>{
      const pc=Math.min(Math.round(it.c/it.t*100),100);
      return `<div class="glass rounded-xl p-3">
        <div class="flex justify-between text-[12px] mb-1.5"><span class="text-zinc-300 font-semibold">${esc(it.l)}</span><span class="text-zinc-500">${n(it.c)} <span class="text-zinc-700">/ ${n(it.t)}</span></span></div>
        <div class="h-1.5 rounded-full bg-white/[.06] overflow-hidden"><div class="h-full rounded-full bg-emerald-400" style="width:${pc}%"></div></div>
      </div>`}).join('')}</div>`;

  const rv=stage==='review';
  if(!P.length)return empty(rv?'피드백을 기록한 콘텐츠가 없습니다':'발행한 콘텐츠가 없습니다',
    rv?'발행한 콘텐츠에 성과를 입력하면 여기로 넘어옵니다':'기획을 발행 단계로 넘기면 여기에 쌓입니다')+(rv?goalBox:'');

  /* KPI는 발행된 전체(발행+피드백) 기준. 단계별로 숫자가 갈리면 판단이 흐려진다. */
  const A=pub(),sum=k=>A.reduce((s,p)=>s+(+(p.m?.[k])||0),0),avg=k=>Math.round(sum(k)/A.length);
  const kpi=[['평균 조회수',avg('v'),300,'20편 시점 300 미만 → 훅 재검토'],['누적 DM',sum('dm'),5,'누적 5건 미만 → 전환 동선 재설계'],
             ['평균 댓글',avg('c'),3,'Phase 1 기준 3'],['평균 저장',avg('s'),0,'']];
  return `${rv?`<div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 mb-4">${kpi.map(([l,x,t,h])=>{
      const bad=t&&x<t&&A.length>=20;
      return `<div class="glass rounded-xl p-3"><div class="text-[10px] text-zinc-500">${l}</div>
        <div class="text-xl font-bold ${bad?'text-rose-400':'text-zinc-100'} mt-0.5">${n(x)}</div>
        ${t?`<div class="text-[9px] text-zinc-600 mt-1">기준 ${t} · ${h}</div>`:''}</div>`}).join('')}</div>
    <div class="text-[11px] text-zinc-600 mb-3">릴스 ${A.length}/20편 — 20편 시점에 실패 기준으로 평가합니다</div>`
    :`<div class="text-[11px] text-zinc-600 mb-3">성과를 입력하면 5. 피드백 단계로 넘어갑니다</div>`}
    <div class="space-y-2">${P.map(p=>{
      const c=CATS[p.cat],m=p.m||{};
      return `<button onclick="openPost(${p.id})" class="w-full glass rounded-xl p-3.5 flex items-center gap-3.5 text-left hover:bg-white/[.07]">
        <div class="w-14 h-14 shrink-0 rounded-lg bg-gradient-to-br ${c.g} flex items-center justify-center text-[10px] font-bold" style="color:${c.c}">${c.n}</div>
        <div class="flex-1 min-w-0">
          <div class="text-[13px] font-semibold text-zinc-100 truncate">${esc(p.hook||p.topic)}</div>
          <div class="text-[11px] text-zinc-500 mt-0.5">${p.date||'날짜 미정'} · ${p.tpl!=null?esc(TPLS[p.tpl].name):'훅 미지정'}</div>
        </div>
        <div class="flex gap-3 text-[11px] shrink-0">${[['조회',m.v],['좋아요',m.l],['댓글',m.c],['DM',m.dm]].map(([l,x])=>
          `<div class="text-center"><div class="font-bold text-zinc-200">${n(x)}</div><div class="text-[9px] text-zinc-600">${l}</div></div>`).join('')}</div>
        ${rv?'':'<span class="text-[10px] font-bold text-sky-400 shrink-0">성과 입력 대기</span>'}
      </button>`}).join('')}</div>${rv?goalBox:''}`;
}

/* ─── 레퍼런스 ─── */
/* 공개 게시물만 임베드된다. 비공개·삭제된 링크는 iframe이 빈 상태로 뜬다. */
const IG_RE=/instagram\.com\/(?:p|reel|reels|tv)\/([A-Za-z0-9_-]+)/;

const igEmbed=u=>{const c=igCode(u);return c?`https://www.instagram.com/p/${c}/embed/`:''};
const tagsOf=r=>(r.tags||'').split(/[,#\s]+/).filter(Boolean);
function showEmbed(btn,url){btn.outerHTML=`<iframe src="${url}" scrolling="no" loading="lazy" class="w-full h-[420px] mt-2.5 rounded-lg border-none bg-black"></iframe>`}
function tagClick(rid,i){const t=tagsOf(D.refs.find(r=>r.id===rid))[i];D.refTag=D.refTag===t?'':t;save();render()}

function refsHTML(){

    ${D.refTag?`<button onclick="D.refTag='';save();render()" class="text-[11px] font-semibold px-3 py-1.5 rounded-lg bg-pink-500/15 text-pink-300">#${esc(D.refTag)} ✕</button>`:''}
    <button onclick="openRefImport()" class="text-[11px] font-semibold px-3 py-1.5 rounded-lg bg-white/[.05] text-zinc-400 ml-auto">조사분 가져오기</button>
    <button onclick="openRefAdd()" class="text-[11px] font-semibold px-3 py-1.5 rounded-lg bg-emerald-500/15 text-emerald-400">+ 추가</button></div>
  ${rs.length?'':empty('해당하는 레퍼런스가 없습니다','필터를 지우거나 새 레퍼런스를 추가하세요')}
  <div class="grid sm:grid-cols-2 gap-2.5">${rs.map(r=>`
    <div class="glass rounded-xl p-3.5">
      <div class="flex items-start justify-between gap-2">
        <div class="min-w-0">
          <div class="text-[13px] font-bold text-zinc-100 truncate">${r.link?`<a href="${esc(r.link)}" target="_blank" rel="noopener" class="hover:underline">${esc(r.handle)}</a>`:esc(r.handle)}</div>
          <div class="text-[10px] text-zinc-500">${esc(r.followers)}${r.eng?` · 참여율 ${esc(r.eng)}`:''}</div>
        </div>
        <div class="flex gap-1 shrink-0">
          ${r.folder?`<span class="text-[9px] font-bold px-1.5 py-0.5 rounded bg-sky-500/15 text-sky-400">${FOLDER[r.folder]}</span>`:''}
          <span class="text-[9px] font-bold px-1.5 py-0.5 rounded bg-white/[.07] text-zinc-400">${RCAT[r.cat]||r.cat}</span>
        </div>
      </div>
      ${r.desc?`<p class="text-[11px] text-zinc-400 mt-2 leading-relaxed">${esc(r.desc)}</p>`:''}
      ${r.why?`<p class="text-[11px] text-zinc-300 mt-1.5 leading-relaxed"><span class="text-zinc-600">왜 —</span> ${esc(r.why)}</p>`:''}
      ${tagsOf(r).length?`<div class="flex gap-1 flex-wrap mt-2">${tagsOf(r).map((t,i)=>
        `<button onclick="tagClick(${r.id},${i})" class="text-[10px] font-semibold px-1.5 py-0.5 rounded ${D.refTag===t?'bg-pink-500/25 text-pink-200':'bg-white/[.06] text-zinc-400 hover:text-zinc-200'}">#${esc(t)}</button>`).join('')}</div>`:''}
      ${(r.insights||[]).length?`<div class="mt-2.5 space-y-1">${r.insights.map(i=>
        `<div class="text-[11px] text-pink-300 bg-pink-500/10 rounded-lg px-2.5 py-1.5 flex gap-1.5"><span class="shrink-0">→</span><span>${esc(i)}</span></div>`).join('')}</div>`:''}
      ${igEmbed(r.link)?`<button onclick="showEmbed(this,'${igEmbed(r.link)}')" class="w-full mt-2.5 py-2 rounded-lg bg-white/[.05] hover:bg-white/[.1] text-[11px] font-semibold text-zinc-300">▶ 영상 보기</button>`:''}
      <div class="flex gap-1.5 mt-2.5">
        <button onclick="openInsight(${r.id})" class="flex-1 text-[11px] font-semibold py-2 rounded-lg bg-white/[.05] hover:bg-white/[.1] text-zinc-300">적용점 뽑기 →</button>

      </div>
    </div>`).join('')}</div>`;
}

/* ═══ 모달 ═══ */
const M=(t,body,foot='')=>`<div class="flex items-center justify-between px-5 py-4 border-b border-white/[.08] sticky top-0 glass-strong z-10">
  <h3 class="text-[15px] font-bold text-zinc-100">${t}</h3>

  <div class="p-5 space-y-3">${body}</div>${foot?`<div class="px-5 pb-5 flex gap-2">${foot}</div>`:''}`;
const F=(l,el)=>`<div><label class="text-[11px] font-semibold text-zinc-500 block mb-1.5">${l}</label>${el}</div>`;
const BTN=(t,fn,cls='bg-emerald-500 text-black')=>`<button onclick="${fn}" class="flex-1 py-2.5 rounded-xl text-[13px] font-bold ${cls}">${t}</button>`;
function openModal(h){document.getElementById('mbox').innerHTML=h;const m=document.getElementById('modal');m.classList.remove('hidden');m.classList.add('flex')}
function closeModal(){const m=document.getElementById('modal');m.classList.add('hidden');m.classList.remove('flex')}

function openStats(){

    [['팔로워','followers'],['DM 문의 (누적)','dm'],['댓글 (누적)','comments']].map(([l,k])=>F(l,`<input type="number" id="s_${k}" value="${D.ig[k]}">`)).join('')
    +`<p class="text-[11px] text-zinc-600 leading-relaxed">KPI는 팔로워가 아니라 DM·댓글입니다. Phase 1 기준 = 월 DM 5건, 릴스당 댓글 3개.</p>`,
    BTN('저장','saveStats()')));
}
function saveStats(){D.ig={followers:+v('s_followers'),dm:+v('s_dm'),comments:+v('s_comments')};save();closeModal();render()}

function openGoals(){
  const g=D.goals[D.goalTab];
  openModal(M(`${g.period} 목표 — 현재 수치`,

function openId(){

function openInsight(rid){
  const r=D.refs.find(x=>x.id===rid);
  openModal(M(`적용점 — ${esc(r.handle)}`,
    (r.why?`<div class="glass rounded-xl p-3 text-[11px] text-zinc-400 leading-relaxed">${esc(r.why)}</div>`:'')

    +F('바로 기획으로 넘길 카테고리',`<select id="i_cat">${Object.entries(CATS).map(([k,c])=>`<option value="${k}">${c.n} (${c.t}%)</option>`).join('')}</select>`),

function saveInsight(rid){

function blank(o){return{id:uid(),stage:'insight',refId:null,refHandle:'',insight:'',cat:'diet',tpl:null,topic:'',hook:'',script:'',caption:'',tags:'',date:'',link:'',m:{v:0,l:0,c:0,s:0,dm:0},lesson:'',...o}}

}
function saveRef(){
  const h=v('r_h').trim();if(!h)return alert('계정명을 입력하세요');
  D.refs.unshift({id:uid(),handle:h,link:v('r_l'),followers:v('r_f'),cat:v('r_c'),folder:v('r_fo'),tags:v('r_t'),desc:v('r_d'),why:v('r_w'),eng:'',insights:[]});
  save();closeModal();D.tab='ref';D.refTag='';render();
}
function delRef(id){if(!confirm('이 레퍼런스를 삭제할까요?'))return;D.refs=D.refs.filter(r=>r.id!==id);save();render()}

/* ─── 조사분 가져오기 ───
   bm_import.json = 조사 라운드가 쌓이는 누적 배열.
   같은 폴더에 있으면 자동으로 읽고, 없으면 파일을 고르게 한다(file:// 대응). */
let ROUNDS=null;
async function openRefImport(){
  try{const r=await fetch('bm_import.json',{cache:'no-store'});if(r.ok)return pickRound(await r.json())}catch(e){}
  document.getElementById('bmFileInput').click();
}
function bmFile(el){
  const f=el.files[0];el.value='';if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{try{pickRound(JSON.parse(rd.result))}catch(e){alert('bm_import.json 형식이 아닙니다')}};
  rd.readAsText(f);
}
function pickRound(rounds){
  if(!Array.isArray(rounds)||!rounds.length)return alert('조사 라운드가 없습니다');
  ROUNDS=rounds;
  const have=new Set(D.refs.map(r=>r.handle));
  openModal(M('조사분 가져오기',
    `<p class="text-[11px] text-zinc-500 leading-relaxed">라운드를 고르면 <b class="text-zinc-300">아직 없는 계정만</b> 추가합니다. 기존 레퍼런스와 기획은 그대로 둡니다.</p>`
    +rounds.map((rd,i)=>{
      const nu=(rd.entries||[]).filter(e=>!have.has(e.handle)).length;
      return `<button onclick="importRound(${i})" ${nu?'':'disabled'} class="w-full text-left px-4 py-3 rounded-xl ${nu?'bg-white/[.05] hover:bg-white/[.1]':'bg-white/[.02] opacity-40 cursor-default'}">
        <div class="text-[13px] font-bold text-zinc-100">${esc(rd.label||'이름 없는 라운드')}</div>
        <div class="text-[11px] text-zinc-500 mt-0.5">${esc(rd.date||'')} · 전체 ${(rd.entries||[]).length}건 · ${nu?`<b class="text-emerald-400">새 계정 ${nu}건</b>`:'이미 다 있음'}</div>
      </button>`}).join('')));
}
function importRound(i){
  const have=new Set(D.refs.map(r=>r.handle));
  const add=(ROUNDS[i].entries||[]).filter(e=>e.handle&&!have.has(e.handle));
  if(!add.length)return;
  add.forEach(e=>D.refs.unshift({id:uid(),folder:'',tags:'',insights:[],...e}));
  save();closeModal();D.tab='ref';D.refCat='all';D.refTag='';render();
  alert(`${add.length}건 추가했습니다.\n필요 없는 계정은 카드의 ✕로 지우면 됩니다.`);
}

/* 콘텐츠 상세 — 4단계 세로 폼 */
function openPost(id){
  const p=D.posts.find(x=>x.id===id);if(!p)return;
  const si=SIDX(p.stage);
  const step=(k,title,body)=>{
    const i=SIDX(k),done=si>i,cur=si===i,s=STAGES[i];
    return `<div class="relative pl-8 pb-4 ${i<4?'border-l':''} border-white/[.08] ml-2">
      <div class="absolute -left-[9px] top-0 w-[18px] h-[18px] rounded-full flex items-center justify-center text-[9px] font-bold ${done?'text-black':'text-zinc-500'}" style="background:${done||cur?s.c:'rgba(255,255,255,.1)'}">${done?'✓':i}</div>
      <div class="text-[11px] font-bold mb-2" style="color:${done||cur?s.c:'#71717a'}">${i}. ${title}</div>
      <div class="space-y-2.5 ${done||cur?'':'opacity-45'}">${body}</div></div>`};
  const t=p.tpl!=null?TPLS[p.tpl]:null;

  openModal(M('콘텐츠 상세',
    step('insight','적용점 — 어느 레퍼런스에서 왔나',
      (p.refHandle?`<div class="text-[11px] text-zinc-500">레퍼런스: <b class="text-zinc-300">${esc(p.refHandle)}</b></div>`:'')
      +F('적용점',`<textarea id="p_ins" rows="2">${esc(p.insight)}</textarea>`))
    +step('plan','기획',
      F('카테고리',`<select id="p_cat">${Object.entries(CATS).map(([k,c])=>`<option value="${k}"${p.cat===k?' selected':''}>${c.n} — ${c.role}</option>`).join('')}</select>`)
      +F('훅 템플릿',`<select id="p_tpl" onchange="tplHint()"><option value="">— 미지정 —</option>${TPLS.map((x,i)=>`<option value="${i}"${p.tpl===i?' selected':''}>[${x.cat}·${HOOKS[x.cat]}] ${x.name}</option>`).join('')}</select>
        <div id="tplHint" class="text-[11px] text-zinc-500 mt-1.5 leading-relaxed">${t?`<span class="text-emerald-400 font-bold">긍</span> ${esc(t.pos)}<br><span class="text-rose-400 font-bold">부</span> ${esc(t.neg)}`:''}</div>`)
      +F('주제',`<input id="p_topic" value="${esc(p.topic)}" placeholder="예: 그랜저 하이브리드 옵션 다이어트">`)
      +F('훅 — 인트로 "차키 탁 → 잠깐만요!" 다음 첫 대사',`<textarea id="p_hook" rows="2">${esc(p.hook)}</textarea>`)
      +F('대본 — 7~30초 · 원테이크 · 엔딩 "신부장이라면 이렇게 선택하겠습니다"',`<textarea id="p_script" rows="5">${esc(p.script)}</textarea>`)
      +F('캡션 — 1행 검색키워드+차종명 / 마지막행 답이 갈리는 질문',`<textarea id="p_cap" rows="4">${esc(p.caption)}</textarea>`)
      +F('해시태그 — 중소형 5~8개',`<input id="p_tags" value="${esc(p.tags)}" placeholder="#그랜저견적 #광주현대차">`))
    +step('publish','발행',
      F('발행일 — 저녁 19~21시',`<input type="date" id="p_date" value="${p.date}">`)
      +F('게시물 링크',`<input id="p_link" value="${esc(p.link)}" placeholder="https://instagram.com/reel/...">`))
    +step('review','피드백',
      `<div class="grid grid-cols-5 gap-1.5">${[['v','조회'],['l','좋아요'],['c','댓글'],['s','저장'],['dm','DM']].map(([k,l])=>
        `<div><label class="text-[10px] text-zinc-500 block mb-1">${l}</label><input type="number" id="p_m_${k}" value="${p.m?.[k]||0}"></div>`).join('')}</div>`
      +F('배운 것 → 다음 레퍼런스 조사에 반영',`<textarea id="p_lesson" rows="3" placeholder="무엇이 먹혔고 무엇이 안 먹혔나">${esc(p.lesson)}</textarea>`)),
    BTN('저장',`savePost(${id})`,'bg-white/[.1] text-zinc-200')
    +(p.stage!=='review'?BTN(`저장 + ${STAGES[SIDX(NEXT[p.stage])].n} 단계로 →`,`savePost(${id},1)`):'')
    +`<button onclick="delPost(${id})" class="px-4 py-2.5 rounded-xl text-[13px] font-bold bg-rose-500/15 text-rose-400">삭제</button>`));
}
function tplHint(){
  const i=v('p_tpl'),el=document.getElementById('tplHint');
  el.innerHTML=i===''?'':`<span class="text-emerald-400 font-bold">긍</span> ${esc(TPLS[+i].pos)}<br><span class="text-rose-400 font-bold">부</span> ${esc(TPLS[+i].neg)}`;
}
function savePost(id,adv){
  const p=D.posts.find(x=>x.id===id);
  Object.assign(p,{insight:v('p_ins'),cat:v('p_cat'),topic:v('p_topic'),hook:v('p_hook'),script:v('p_script'),
    caption:v('p_cap'),tags:v('p_tags'),date:v('p_date'),link:v('p_link'),lesson:v('p_lesson'),
    m:{v:+v('p_m_v'),l:+v('p_m_l'),c:+v('p_m_c'),s:+v('p_m_s'),dm:+v('p_m_dm')}});
  const t=v('p_tpl');p.tpl=t===''?null:+t;
  if(adv){
    if(p.stage==='plan'&&!p.hook.trim())return alert('훅 없이 발행 단계로 넘길 수 없습니다');
    if(p.stage==='publish'&&!p.date)return alert('발행일을 입력하세요');
    p.stage=NEXT[p.stage];
  }
  save();closeModal();render();
}
function delPost(id){if(!confirm('삭제할까요?'))return;D.posts=D.posts.filter(x=>x.id!==id);save();closeModal();render()}

/* ═══ 인스타 동기화 — 내 계정만. 숫자만 덮어쓰고 사람이 쓴 기획·대본은 건드리지 않는다 ═══ */
function openSync(){
  openModal(M('인스타 동기화',
    F('Apps Script 웹앱 주소',`<input id="sy_url" value="${esc(D.syncUrl)}" placeholder="https://script.google.com/macros/s/.../exec">`)
    +`<p class="text-[11px] text-zinc-500 leading-relaxed">ig_sync.gs를 Apps Script에 올리고 배포한 주소입니다. 토큰은 그쪽에만 있고 이 파일에는 저장되지 않습니다.</p>
      <p class="text-[11px] text-zinc-600 leading-relaxed">동기화는 <b class="text-zinc-400">조회·좋아요·댓글·저장</b>과 팔로워 수만 덮어씁니다. 훅·대본·적용점은 그대로 둡니다.
      게시물 링크가 입력된 콘텐츠끼리 자동으로 짝지어집니다.</p>
      ${D.syncAt?`<p class="text-[11px] text-zinc-600">마지막 동기화: ${new Date(D.syncAt).toLocaleString('ko-KR')}</p>`:''}`,
    BTN('저장하고 지금 동기화','saveSync()')));
}
function saveSync(){D.syncUrl=v('sy_url').trim();save();closeModal();syncIG(1)}

async function syncIG(loud){
  if(!D.syncUrl)return openSync();
  const b=document.getElementById('syncBtn');if(b)b.textContent='동기화 중…';
  try{
    const res=await fetch(D.syncUrl);
    const d=await res.json();
    if(!d.ok)throw new Error(d.error||'응답을 이해할 수 없습니다');
    D.ig.followers=d.followers;
    const by={};d.posts.forEach(p=>{const c=igCode(p.permalink);if(c)by[c]=p});
    let hit=0;
    D.posts.forEach(p=>{
      const s=by[igCode(p.link)];if(!s)return;
      p.m={...p.m,v:s.v,l:s.l,c:s.c,s:s.s};
      if(!p.date)p.date=s.date;
      delete by[igCode(p.link)];hit++;
    });
    /* 팔로워 목표는 사람이 다시 옮겨 적을 이유가 없다 */
    D.goals.forEach(g=>g.items.forEach(it=>{if(it.l==='팔로워')it.c=d.followers}));
    const rest=Object.values(by);
    D.syncAt=d.at;save();render();
    if(loud||hit)alert(`동기화 완료 — 성과 ${hit}건 갱신, 팔로워 ${n(d.followers)}명`
      +(rest.length?`\n\n대시보드에 없는 인스타 게시물 ${rest.length}건이 있습니다. "가져오기" 버튼으로 불러올 수 있습니다.`:''));
    D._orphan=rest;render();
  }catch(e){if(loud)alert('동기화 실패 — '+e.message+'\n\n주소가 맞는지, 배포 액세스가 "모든 사용자"인지 확인하세요.');else console.warn('동기화 실패',e)}
  finally{if(document.getElementById('syncBtn'))document.getElementById('syncBtn').textContent='동기화'}
}
/* 인스타에는 있는데 대시보드에 없는 게시물 — 5.피드백 단계로 취합한다 */
function importOrphans(){
  const o=D._orphan||[];if(!o.length)return;
  if(!confirm(`인스타 게시물 ${o.length}건을 피드백 단계로 가져옵니다. 기획 내용은 비어 있습니다.`))return;
  o.forEach(s=>D.posts.push(blank({stage:'review',topic:s.caption||'(인스타에서 가져옴)',link:s.permalink,
    date:s.date,m:{v:s.v,l:s.l,c:s.c,s:s.s,dm:0}})));
  D._orphan=[];save();D.tab='review';render();
}

/* ═══ 공유 설정 ═══ */
function openShare(){
  const on=!!cfg.url;
  openModal(M('구글 시트 공유',
    F('웹 앱 주소',`<input id="sh_url" value="${esc(cfg.url||'')}" placeholder="https://script.google.com/macros/s/.../exec">`)
    +F('접근키',`<input id="sh_key" value="${esc(cfg.key||'')}" placeholder="setup() 실행 로그의 ACCESS KEY">`)
    +`<div class="text-[11px] text-zinc-500 leading-relaxed">
        <p class="mb-2">sheet_api.gs를 시트의 Apps Script에 올리고 <b class="text-zinc-300">setup()</b>을 한 번 실행한 뒤 배포하세요.
        같은 주소·키를 넣은 사람끼리 레퍼런스·기획·수치를 함께 봅니다.</p>
        <p class="text-zinc-600">보고 있는 탭과 필터는 공유되지 않습니다 — 각자 화면입니다.</p>
        ${on?`<p class="text-zinc-600 mt-2">현재 상태: ${LINK[link][2]}</p>`:''}
      </div>`,
    BTN('저장하고 불러오기','saveShare()')
    +(on?BTN('시트에 올리기','pushNow()','bg-white/[.1] text-zinc-200')
        +`<button onclick="unlinkShare()" class="px-4 py-2.5 rounded-xl text-[13px] font-bold bg-rose-500/15 text-rose-400">해제</button>`:'')));
}
function saveShare(){
  const u=v('sh_url').trim(),k=v('sh_key').trim();
  if(!u||!k)return alert('주소와 접근키를 모두 입력하세요');
  cfg={url:u,key:k};saveCfg();closeModal();pull(1);
}
function pushNow(){
  if(!confirm('지금 이 브라우저의 내용을 시트에 올립니다.\n시트에 있던 내용은 덮어써집니다. 계속할까요?'))return;
  rev=0;closeModal();
  /* rev를 서버 값에 맞춘 뒤 올린다 */
  call(null).then(d=>{if(d.ok){rev=d.rev;push()}else alert('실패 — '+d.error)});
}
function unlinkShare(){
  if(!confirm('공유를 해제합니다. 이 브라우저에 있는 내용은 그대로 남습니다.'))return;
  cfg={};saveCfg();setLink('local');closeModal();
}

/* 되돌릴 수 없다. 백업을 먼저 권한다. */
function resetAll(){
  const msg=cfg.url
    ?'이 브라우저의 내용을 지우고 시트에서 다시 불러옵니다.\n시트 내용은 지워지지 않습니다. 계속할까요?'
    :'기획·수치·메모·레퍼런스를 모두 지우고 처음 상태로 되돌립니다.\n되돌릴 수 없습니다. 계속할까요?';
  if(!confirm(msg))return;
  if(!cfg.url&&D.posts.length&&!confirm(`기획 ${D.posts.length}건이 사라집니다. 백업 없이 진행할까요?`))return;
  localStorage.removeItem(KEY);location.reload();
}

/* 백업 — localStorage는 브라우저를 넘지 못한다 */
function exportJSON(){
  const b=new Blob([JSON.stringify(D,null,1)],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=`신부장_스튜디오_${new Date().toISOString().slice(0,10)}.json`;a.click();
}
function importJSON(el){
  const f=el.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{D={...clone(DEFAULTS),...JSON.parse(r.result)};save();render();alert('복원 완료')}catch(e){alert('파일을 읽을 수 없습니다')}};
  r.readAsText(f);el.value='';
}

/* 남이 고친 걸 볼 방법이 없으면 낡은 화면 위에서 작업하다 충돌만 난다.
   주기적으로 조르지 않고, 탭으로 돌아올 때만 조용히 당겨온다. */
let lastPull=0;
addEventListener('focus',()=>{
  if(!cfg.url||pushing||dirty)return;
  if(Date.now()-lastPull<30000)return;
  lastPull=Date.now();pull();
});

render();
setLink(cfg.url?'pending':'local');
/* 열 때 시트에서 먼저 당겨온다. 남이 그 사이에 바꾼 걸 모르고 덮어쓰면 안 된다. */
if(cfg.url){lastPull=Date.now();pull()}
/* 인스타 주소가 등록돼 있으면 조용히 최신 지표도 당겨온다. */
if(D.syncUrl)syncIG();
</script>
