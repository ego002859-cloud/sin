<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>신부장 채널 운영판</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css">
<script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
<script>
tailwind.config={theme:{extend:{fontFamily:{sans:['Pretendard','-apple-system','BlinkMacSystemFont','system-ui','sans-serif']}}}}
</script>
<style>
@keyframes fadeInUp{from{opacity:0;transform:translateY(1.5rem)}to{opacity:1;transform:translateY(0)}}
.reveal{opacity:0;transform:translateY(1.5rem)}.reveal.visible{animation:fadeInUp .6s cubic-bezier(.16,1,.3,1) forwards}
.delay-1{animation-delay:.1s}.delay-2{animation-delay:.2s}.delay-3{animation-delay:.3s}.delay-4{animation-delay:.4s}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.b-A{color:#fb7185;background:rgba(251,113,133,.1)}.b-B{color:#fbbf24;background:rgba(251,191,36,.1)}
.b-C{color:#a78bfa;background:rgba(167,139,250,.1)}.b-D{color:#38bdf8;background:rgba(56,189,248,.1)}
.b-E{color:#34d399;background:rgba(52,211,153,.1)}
.f-reels{color:#fb7185;background:rgba(251,113,133,.1)}.f-car{color:#38bdf8;background:rgba(56,189,248,.1)}
.st-p{color:rgba(255,255,255,.35);background:rgba(255,255,255,.06)}
.st-w{color:#fbbf24;background:rgba(251,191,36,.12)}.st-d{color:#34d399;background:rgba(52,211,153,.12)}
.rf-visual{color:#60a5fa;background:rgba(96,165,250,.15)}.rf-caption{color:#fbbf24;background:rgba(251,191,36,.15)}
.rf-tempo{color:#a78bfa;background:rgba(167,139,250,.15)}.rf-script{color:#34d399;background:rgba(52,211,153,.15)}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:3px}
body{background:#0a0a0a}
.glass{background:rgba(255,255,255,.04);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border:1px solid rgba(255,255,255,.08)}
.glass-strong{background:rgba(255,255,255,.06);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border:1px solid rgba(255,255,255,.1)}
.glass-nav{background:rgba(24,24,27,.72);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(255,255,255,.06)}
input,textarea,select{background:rgba(255,255,255,.05)!important;border:1px solid rgba(255,255,255,.1)!important;color:#e4e4e7!important}
input:focus,textarea:focus,select:focus{outline:none;border-color:rgba(52,211,153,.4)!important;box-shadow:0 0 0 2px rgba(52,211,153,.1)}
</style>

<!-- NAV -->
<nav class="glass-nav sticky top-0 z-40 px-5 py-5">
  <div class="max-w-5xl mx-auto flex items-center justify-between flex-wrap gap-3">
    <div class="flex items-center gap-4">
      <span class="text-2xl font-extrabold tracking-tight text-zinc-100">신부장</span>
      <div>
        <span class="text-xs font-semibold text-zinc-400 bg-white/[.06] px-3 py-1 rounded-full">@sinbujang_car</span>
        <p class="text-[11px] text-zinc-500 mt-1">채널 운영판 · 대행-클라이언트 협력 도구</p>
      </div>
    </div>
    <span class="text-xs font-medium text-zinc-500" id="hdDate"></span>
  </div>
</nav>

<main class="max-w-5xl mx-auto px-5 pb-24 space-y-16 mt-4">

<!-- 1. INSTAGRAM -->
<section class="reveal">
  <div class="flex items-center justify-between flex-wrap gap-3 mb-5">
    <div>
      <p class="text-[10px] font-semibold tracking-widest uppercase text-emerald-400 mb-1">Instagram</p>
      <h2 class="text-xl font-bold tracking-tight text-zinc-100">인스타 현황판</h2>
    </div>
    <div class="flex gap-2">
      <button onclick="openStatEdit()" class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-white/[.05] border border-white/10 text-zinc-400 hover:text-emerald-400 hover:border-emerald-400/30 transition-all duration-300 hover:scale-[1.02] active:scale-[0.98]">
        <iconify-icon icon="solar:pen-2-linear" class="mr-1 align-[-2px]"></iconify-icon>수치 입력
      </button>
      <button onclick="openEmbedAdd()" class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-white/[.05] border border-white/10 text-zinc-400 hover:text-emerald-400 hover:border-emerald-400/30 transition-all duration-300 hover:scale-[1.02] active:scale-[0.98]">
        <iconify-icon icon="solar:add-circle-linear" class="mr-1 align-[-2px]"></iconify-icon>게시물 추가
      </button>
    </div>
  </div>
  <div class="grid grid-cols-2 md:grid-cols-4 gap-3" id="igStats"></div>
  <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mt-3" id="igEmbeds"></div>
</section>

function load(){try{const r=localStorage.getItem(KEY);if(!r)return JSON.parse(JSON.stringify(DEFAULTS));const d=JSON.parse(r);if(!d.templates)return JSON.parse(JSON.stringify(DEFAULTS));if(!d.refs)d.refs=[];if(!d._refFilter)d._refFilter='all';return d}catch(e){return JSON.parse(JSON.stringify(DEFAULTS))}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
let D=load();

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function fmtDate(ds){const d=new Date(ds+'T00:00:00');return `${d.getMonth()+1}/${d.getDate()} (${DAYS[d.getDay()]})`}
function fmtNum(n){return(n||0).toLocaleString()}

/* ---- render ---- */
function render(){
  document.getElementById('hdDate').textContent=new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
  renderIg();renderId();renderGoals();renderCt();renderBonus();renderNotes();renderRefs();
  initReveal();
}

function renderIg(){

  document.getElementById('igStats').innerHTML=[
    {v:fmtNum(ig.followers),l:'팔로워',icon:'solar:users-group-rounded-linear'},
    {v:fmtNum(ig.posts),l:'게시물',icon:'solar:gallery-minimalistic-linear'},
    {v:fmtNum(ig.weeklyReach),l:'이번 주 도달',icon:'solar:eye-linear'},
    {v:ig.engagement?ig.engagement+'%':'—',l:'참여율',icon:'solar:heart-linear'}
  ].map(s=>`<div class="glass rounded-2xl p-4 cursor-pointer transition-all duration-300 hover:bg-white/[.08] hover:border-white/[.12] hover:scale-[1.02] active:scale-[0.98]">
    <div class="flex items-center gap-2 mb-2"><iconify-icon icon="${s.icon}" class="text-emerald-400 text-base"></iconify-icon><span class="text-[11px] font-medium text-zinc-500 tracking-wide">${s.l}</span></div>
    <div class="text-2xl font-bold text-zinc-100 tabular-nums">${s.v}</div>
  </div>`).join('');

  const emb=ig.embeds||[];
  if(!emb.length){
    document.getElementById('igEmbeds').innerHTML=`<div class="glass rounded-2xl flex items-center justify-center min-h-[200px] col-span-full"><div class="text-center py-10 px-5"><iconify-icon icon="solar:camera-linear" class="text-3xl text-zinc-600 mb-2 block mx-auto"></iconify-icon><p class="text-[13px] text-zinc-500">게시물이 올라오면 여기에 표시됩니다</p><p class="text-[11px] text-zinc-600 mt-1">게시물 추가 버튼으로 Instagram URL을 입력하세요</p></div></div>`;
    return;
  }
  document.getElementById('igEmbeds').innerHTML=emb.map((url,i)=>{
    const code=url.match(/instagram\.com\/(?:p|reel)\/([A-Za-z0-9_-]+)/);

function renderId(){
  const id=D.identity;

  document.getElementById('idBio').textContent=id.bio;
  document.getElementById('idFields').innerHTML=ID_FIELDS.map(f=>
    `<div class="glass rounded-2xl px-5 py-3.5 flex gap-3 items-baseline max-md:flex-col max-md:gap-1"><span class="text-xs font-semibold text-zinc-500 shrink-0 w-[80px]">${f.l}</span><span class="text-[14px] text-zinc-200 break-keep">${esc(id[f.k])}</span></div>`
  ).join('');
}

function renderGoals(){
  const gt=D._goalTab||0;
  document.getElementById('goalTabs').innerHTML=D.goals.map((g,i)=>
    `<button class="text-xs font-semibold px-4 py-1.5 rounded-full border-none cursor-pointer transition-all duration-300 ${i===gt?'bg-emerald-500 text-zinc-950 font-bold':'bg-white/[.05] text-zinc-500 hover:text-zinc-300'}" onclick="D._goalTab=${i};save();renderGoals()">${g.period}</button>`
  ).join('');
  const g=D.goals[gt];
  document.getElementById('goalItems').innerHTML=g.items.map(it=>{
    const pct=it.t?Math.min(Math.round(it.c/it.t*100),100):0;
    const over=it.c>=it.t&&it.t>0;
    return `<div class="glass rounded-2xl px-5 py-4">
      <div class="flex justify-between items-baseline mb-2"><span class="text-[13px] font-medium text-zinc-400">${esc(it.l)}</span><span class="text-sm font-bold text-zinc-100 tabular-nums"><span class="text-emerald-400">${fmtNum(it.c)}</span> / ${fmtNum(it.t)}</span></div>
      <div class="h-1.5 bg-white/[.06] rounded-full overflow-hidden"><div class="h-full rounded-full transition-all duration-500 ease-out ${over?'bg-emerald-500':'bg-emerald-400'}" style="width:${pct}%"></div></div>
      <div class="text-[11px] font-semibold text-zinc-500 mt-1.5 text-right">${pct}%${over?' <iconify-icon icon="solar:check-circle-bold" class="text-emerald-400 align-[-2px]"></iconify-icon>':''}</div>
    </div>`;
  }).join('');
}

  document.getElementById('catTabs').innerHTML=cats.map(c=>
    `<button class="text-[11px] font-semibold px-3 py-1 rounded-full border-none cursor-pointer transition-all duration-300 ${c===filter?'bg-emerald-500 text-zinc-950 font-bold':'bg-white/[.05] text-zinc-500 hover:text-zinc-300'}" onclick="D._catFilter='${c}';save();renderCt()">${catNames[c]}</button>`
  ).join('');
  if(!D._tplOpen)D._tplOpen={};
  const tpls=filter==='all'?D.templates:D.templates.filter(t=>t.cat===filter);
  document.getElementById('ctGrid').innerHTML=`<div class="space-y-2">${tpls.map(t=>{
    const cnt=t.items.length;
    const cc=CAT_CLS[t.cat];
    const isOpen=D._tplOpen[t.id];
    return `<div class="glass rounded-2xl overflow-hidden">
      <div class="px-5 py-3.5 flex items-center gap-3 cursor-pointer transition-colors hover:bg-white/[.04]" onclick="toggleTpl(${t.id})">
        <span class="text-[13px] font-extrabold text-zinc-500 w-5 text-center">${t.id}</span>
        <span class="text-[10px] font-bold px-2 py-0.5 rounded ${cc.cls}">${t.cat}. ${cc.name.slice(0,2)}</span>
        <span class="text-[14px] font-bold text-zinc-100 flex-1 min-w-0 break-keep">${esc(t.name)}</span>
        <span class="text-[11px] font-semibold text-zinc-500">${cnt}개</span>
        <iconify-icon icon="solar:alt-arrow-down-linear" class="text-zinc-500 text-xs transition-transform duration-200 ${isOpen?'rotate-180':''}"></iconify-icon>
      </div>
      ${isOpen?`<div class="border-t border-white/[.06] px-5 py-4">
        <div class="grid gap-1.5 mb-3">
          <div class="flex gap-2 items-baseline text-[13px] text-zinc-400"><span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-emerald-500/10 text-emerald-400 shrink-0">긍</span><span>${esc(t.pos)}</span></div>
          <div class="flex gap-2 items-baseline text-[13px] text-zinc-400"><span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-red-500/10 text-red-400 shrink-0">부</span><span>${esc(t.neg)}</span></div>
        </div>
        <div class="space-y-1.5 mb-3">${t.items.map(ch=>{
          const st=STATUS[ch.status]||STATUS.planned;
          return `<div class="flex items-center gap-2 px-3 py-2 rounded-xl bg-white/[.03] cursor-pointer transition-colors hover:bg-white/[.06] text-[13px]" onclick="event.stopPropagation();openChildDetail(${t.id},${ch.id})">
            ${ch.date?`<span class="text-[11px] text-zinc-500 w-[70px]">${fmtDate(ch.date)}</span>`:'<span class="text-[11px] text-zinc-600 w-[70px]">미정</span>'}
            <span class="text-[10px] font-bold px-2 py-0.5 rounded ${FMT_CLS(ch.format)}">${esc(ch.format)}</span>
            <span class="flex-1 font-medium text-zinc-200 min-w-0">${esc(ch.topic)}</span>
            <button class="text-[11px] font-semibold px-2.5 py-0.5 rounded-lg border-none cursor-pointer ${st.c}" onclick="event.stopPropagation();cycleChildSt(${t.id},${ch.id})">${st.l}</button>
          </div>`;
        }).join('')}</div>
        <button class="w-full py-2 border border-dashed border-white/10 rounded-xl bg-transparent text-zinc-500 text-xs font-medium cursor-pointer transition-all hover:border-emerald-400/30 hover:text-emerald-400" onclick="event.stopPropagation();openChildAdd(${t.id})"><iconify-icon icon="solar:add-circle-linear" class="mr-1 align-[-2px]"></iconify-icon>구체 기획 추가</button>
      </div>`:''}
    </div>`;
  }).join('')}</div>`;
}

function renderBonus(){
  const bonus=D.bonus||[];
  const el=document.getElementById('bonusList');
  if(!bonus.length){
    el.innerHTML='<div class="glass rounded-2xl text-center text-zinc-500 text-[13px] py-10 border-dashed">아이디어를 추가해보세요</div>';
    return;
  }
  el.innerHTML=`<div class="space-y-2">${bonus.map(b=>{
    const st=STATUS[b.status]||STATUS.planned;
    return `<div class="glass rounded-2xl px-5 py-3.5 cursor-pointer transition-all duration-300 hover:bg-white/[.06] hover:scale-[1.01] active:scale-[0.99]" onclick="openBonusDetail(${b.id})">
      <div class="flex justify-between items-center">
        <div><div class="text-xs font-bold text-emerald-400 mb-1">${esc(b.keyword)}</div><div class="text-[14px] font-medium text-zinc-200 break-keep">${esc(b.idea)}</div></div>
        <button class="text-[11px] font-semibold px-2.5 py-0.5 rounded-lg border-none cursor-pointer shrink-0 ml-3 ${st.c}" onclick="event.stopPropagation();cycleBonusSt(${b.id})">${st.l}</button>
      </div>
    </div>`;
  }).join('')}</div>`;
}

function renderNotes(){
  const notes=[...D.notes].reverse();
  if(!notes.length){
    document.getElementById('noteList').innerHTML='<div class="glass rounded-2xl text-center text-zinc-500 text-[13px] py-8 border-dashed">아직 메모가 없습니다</div>';
    return;
  }
  document.getElementById('noteList').innerHTML=notes.map((n,i)=>
    `<div class="glass rounded-2xl px-5 py-3.5 relative group"><div class="text-[11px] font-medium text-zinc-500 mb-1"><strong class="text-emerald-400 font-semibold">${esc(n.author)}</strong> · ${esc(n.date)}</div><div class="text-[14px] text-zinc-200 break-keep">${esc(n.text)}</div><button class="absolute top-3 right-3 bg-transparent border-none text-zinc-600 cursor-pointer text-base opacity-0 group-hover:opacity-100 transition-opacity hover:text-red-400" onclick="delNote(${D.notes.length-1-i})"><iconify-icon icon="solar:trash-bin-minimalistic-linear"></iconify-icon></button></div>`
  ).join('');
}

/* ---- actions ---- */
function toggleTpl(id){if(!D._tplOpen)D._tplOpen={};D._tplOpen[id]=!D._tplOpen[id];save();renderCt()}
function cycleChildSt(tplId,chId){const t=D.templates.find(x=>x.id===tplId);if(!t)return;const ch=t.items.find(x=>x.id===chId);if(!ch)return;ch.status=NEXT_ST[ch.status]||'planned';save();renderCt()}
function cycleBonusSt(id){const b=(D.bonus||[]).find(x=>x.id===id);if(!b)return;b.status=NEXT_ST[b.status]||'planned';save();renderBonus()}
function addNote(){
  const au=document.getElementById('noteAuthor').value;
  const tx=document.getElementById('noteInput').value.trim();
  if(!tx)return;
  D.notes.push({author:au,text:tx,date:new Date().toLocaleDateString('ko-KR')});
  document.getElementById('noteInput').value='';
  save();renderNotes();

/* ---- refs ---- */
function refEmbed(url){
  const m=url.match(/instagram\.com\/(?:p|reel|reels)\/([A-Za-z0-9_-]+)/);
  return m?`https://www.instagram.com/p/${m[1]}/embed/`:null;
}
function renderRefs(){
  const filter=D._refFilter||'all';
  const folders=Object.keys(REF_FOLDERS);
  document.getElementById('refTabs').innerHTML=folders.map(f=>
    `<button class="text-[11px] font-semibold px-3 py-1 rounded-full border-none cursor-pointer transition-all duration-300 ${f===filter?'bg-emerald-500 text-zinc-950 font-bold':'bg-white/[.05] text-zinc-500 hover:text-zinc-300'}" onclick="D._refFilter='${f}';save();renderRefs()">${REF_FOLDERS[f]}</button>`
  ).join('');
  const refs=filter==='all'?D.refs:D.refs.filter(r=>r.folder===filter);
  if(!refs.length){
    document.getElementById('refGrid').innerHTML='<div class="glass rounded-2xl text-center text-zinc-500 text-[13px] py-10 border-dashed col-span-full">Instagram 게시물을 스크랩해서 레퍼런스를 모아보세요</div>';
    return;
  }
  document.getElementById('refGrid').innerHTML=refs.map(r=>{
    const embedUrl=refEmbed(r.url);
    const fcls=REF_F_CLS[r.folder]||'rf-visual';
    return `<div class="glass rounded-2xl overflow-hidden transition-all duration-300 hover:bg-white/[.06]">
      ${embedUrl?`<iframe src="${embedUrl}" scrolling="no" allowtransparency="true" loading="lazy" class="w-full border-none h-[420px] block"></iframe>`:`<div class="py-10 text-center text-zinc-500 text-sm">임베드 불가</div>`}
      <div class="flex items-start gap-2 px-3.5 py-2.5">
        <div class="flex-1 min-w-0">
          <span class="text-[10px] font-bold px-2 py-0.5 rounded inline-block mb-1 ${fcls}">${REF_FOLDERS[r.folder]||r.folder}</span>
          ${r.memo?`<div class="text-xs text-zinc-400 mt-0.5 leading-relaxed break-keep">${esc(r.memo)}</div>`:''}
        </div>
        <button class="w-7 h-7 rounded-lg bg-transparent border border-white/10 text-zinc-500 cursor-pointer text-sm flex items-center justify-center shrink-0 transition-all hover:border-red-400 hover:text-red-400 hover:bg-red-500/10" onclick="delRef(${r.id})"><iconify-icon icon="solar:close-circle-linear"></iconify-icon></button>
      </div>
    </div>`;
  }).join('');
}

/* ---- scroll reveal ---- */
function initReveal(){
  const obs=new IntersectionObserver((entries)=>{
    entries.forEach((e,i)=>{if(e.isIntersecting){e.target.style.animationDelay=`${i*80}ms`;e.target.classList.add('visible');obs.unobserve(e.target)}})
  },{threshold:.15});
  document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));
}

render();
</script>
